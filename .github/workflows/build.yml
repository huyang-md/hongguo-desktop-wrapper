name: Build Windows Installer

# 推送 v* 标签时自动构建 exe 并挂到 Release;也可手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 版本号取自标签(去掉 v 前缀),保证产物文件名与标签一致;一致时跳过
      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_V="${GITHUB_REF_NAME#v}"
          PKG_V=$(node -p "require('./package.json').version")
          if [ "$TAG_V" != "$PKG_V" ]; then
            npm version "$TAG_V" --no-git-tag-version
          else
            echo "package.json already at $PKG_V, skip npm version"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Upload release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
