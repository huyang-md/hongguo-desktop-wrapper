name: Build Windows Installer

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check main.js

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Derive version from tag
        shell: bash
        run: |
          TAG_V="${GITHUB_REF_NAME#v}"
          PKG_V=$(node -p "require('./package.json').version")
          if [ "$TAG_V" != "$PKG_V" ]; then
            npm version "$TAG_V" --no-git-tag-version
          else
            echo "package.json already at $PKG_V, skip npm version"
          fi
      - run: npm ci
      - name: Build installer
        run: npm run dist -- --publish never
      - name: Compute SHA-256
        id: sha
        shell: bash
        run: |
          sha256sum dist/*.exe | tee dist/checksums.sha256
          echo "hash=$(sha256sum dist/*.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## SHA-256
          \`${{ steps.sha.outputs.hash }}\`

          > ⚠️ 请仅从本仓库 Releases 页下载安装包;其他站点(网盘/下载站/聚合站)分发的 exe 无法保证未被篡改,认准上方校验值(或 checksums.sha256 侧车文件)。
          EOF
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/checksums.sha256
          body_path: release-notes.md
          generate_release_notes: true
