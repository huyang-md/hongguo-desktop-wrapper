<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>红果短剧</title>
<style>
  html,body{height:100%;margin:0;background:#101014;color:#e8e8ea;font-family:"Microsoft YaHei",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  .box{text-align:center}
  h1{font-size:20px;font-weight:600;margin:0 0 12px}
  p{color:#9a9aa2;font-size:14px;margin:0 0 8px}
  button{background:#fa4242;color:#fff;border:0;border-radius:8px;padding:10px 28px;font-size:14px;cursor:pointer;margin-top:14px}
  button:hover{background:#ff5c5c}
  #countdown{font-size:13px;color:#6f6f78}
</style>
</head>
<body>
  <div class="box">
    <h1>加载失败</h1>
    <p>无法连接红果短剧官网,请检查网络后重试</p>
    <p id="countdown">10 秒后自动重试…</p>
    <button onclick="location.replace('https://hongguoduanju.com/')">立即重试</button>
  </div>
  <script>
    var n = 10;
    var el = document.getElementById('countdown');
    var timer = setInterval(function () {
      n--;
      if (n <= 0) { clearInterval(timer); location.replace('https://hongguoduanju.com/'); }
      else el.textContent = n + ' 秒后自动重试…';
    }, 1000);
  </script>
</body>
</html>
